name: sign-service-api-upload-diagnostics

on:
  workflow_dispatch:
    inputs:
      sign_host:
        description: Temporary signing service host, for example https://sign.example.com.
        required: true
        type: string
      release_ref:
        description: Existing destination release tag whose assets should be uploaded through the API.
        required: true
        type: string
        default: "v3.3.0"
      upload_targets:
        description: "Comma-separated targets: windows,macos-arm64,macos-x86_64, or all."
        required: true
        type: string
        default: "all"
      overwrite:
        description: Overwrite packages already stored on the signing service.
        required: true
        type: boolean
        default: true
      update_client_version:
        description: Also update /admin/client-versions latest_version after uploads.
        required: true
        type: boolean
        default: false
      curl_max_time:
        description: Per upload curl max time in seconds.
        required: true
        type: string
        default: "1200"
      chunk_size_bytes:
        description: Per upload chunk size in bytes.
        required: true
        type: string
        default: "52428800"
      insecure:
        description: Allow insecure TLS for this temporary host test.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sign-service-api-upload-diagnostics-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  api-upload:
    name: Test chunked package API upload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_OUTPUT_LOG: .ci-output/sign-service-api-upload/ci-output.log
      CI_OUTPUT_ENCRYPTED: .ci-output/sign-service-api-upload/ci-output.log.age
      TEMP_SIGN_HOST: ${{ inputs.sign_host }}
      SIGN_MASTER_TOKEN: ${{ secrets.SIGN_MASTER_TOKEN }}
      DESTINATION_REPOSITORY: ${{ secrets.DESTINATION_REPOSITORY }}
      DESTINATION_TOKEN: ${{ secrets.DESTINATION_TOKEN }}
      CI_OUTPUT_AGE_RECIPIENT: ${{ secrets.CI_OUTPUT_AGE_RECIPIENT || vars.CI_OUTPUT_AGE_RECIPIENT }}
      RELEASE_REF: ${{ inputs.release_ref }}
      UPLOAD_TARGETS: ${{ inputs.upload_targets }}
      PACKAGE_UPLOAD_OVERWRITE: ${{ inputs.overwrite }}
      UPDATE_CLIENT_VERSION: ${{ inputs.update_client_version }}
      CURL_MAX_TIME: ${{ inputs.curl_max_time }}
      PACKAGE_UPLOAD_CHUNK_SIZE_BYTES: ${{ inputs.chunk_size_bytes }}
      INSECURE_TLS: ${{ inputs.insecure }}

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate diagnostic configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${CI_OUTPUT_LOG}")"
          : > "${CI_OUTPUT_LOG}"

          for name in TEMP_SIGN_HOST SIGN_MASTER_TOKEN DESTINATION_REPOSITORY DESTINATION_TOKEN CI_OUTPUT_AGE_RECIPIENT RELEASE_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required input, secret, or variable ${name} is not configured."
              exit 1
            fi
          done

          case "${CURL_MAX_TIME}" in
            ""|*[!0-9]*)
              echo "::error::curl_max_time must be a positive integer."
              exit 1
              ;;
          esac
          if [ "${CURL_MAX_TIME}" -lt 30 ] || [ "${CURL_MAX_TIME}" -gt 1800 ]; then
            echo "::error::curl_max_time must be between 30 and 1800."
            exit 1
          fi

          case "${PACKAGE_UPLOAD_CHUNK_SIZE_BYTES}" in
            ""|*[!0-9]*)
              echo "::error::chunk_size_bytes must be a positive integer."
              exit 1
              ;;
          esac
          if [ "${PACKAGE_UPLOAD_CHUNK_SIZE_BYTES}" -lt 1048576 ] || [ "${PACKAGE_UPLOAD_CHUNK_SIZE_BYTES}" -gt 94371840 ]; then
            echo "::error::chunk_size_bytes must be between 1048576 and 94371840."
            exit 1
          fi

      - name: Install age
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          age --version

      - name: Run chunked API upload diagnostics
        id: diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$(dirname "${CI_OUTPUT_LOG}")"
          public_summary="${RUNNER_TEMP}/sign-service-api-upload-summary.md"
          work_dir="${RUNNER_TEMP}/sign-service-api-upload"
          asset_dir="${work_dir}/assets"
          mkdir -p "${asset_dir}"
          result="success"

          sign_host="${TEMP_SIGN_HOST%/}"
          case "${sign_host}" in
            http://*|https://*) ;;
            *) sign_host="https://${sign_host}" ;;
          esac

          release_tag="${RELEASE_REF##refs/tags/}"
          release_version="${release_tag#v}"
          chunked_uploads_endpoint="${sign_host}/packages/chunked-uploads"
          client_versions_endpoint="${sign_host}/admin/client-versions"
          user_agent="PTSkit Downloader/Bot"

          curl_args=(
            --show-error
            --silent
            --location
            --max-time "${CURL_MAX_TIME}"
            --connect-timeout 30
            --retry 5
            --retry-connrefused
            --retry-delay 5
            --header "User-Agent: ${user_agent}"
            --header "X-Master-Key: ${SIGN_MASTER_TOKEN}"
          )
          if [ "${INSECURE_TLS}" = "true" ]; then
            curl_args+=(--insecure)
          fi

          log_line() {
            printf '%s\n' "$*" >> "${CI_OUTPUT_LOG}"
          }

          log_section() {
            {
              printf '\n'
              printf '== %s ==\n' "$1"
            } >> "${CI_OUTPUT_LOG}"
          }

          append_file_excerpt() {
            local label="$1"
            local file="$2"
            local max_bytes="$3"

            log_line "-- ${label} (${file}) --"
            if [ ! -s "${file}" ]; then
              log_line "(empty)"
              return
            fi

            python3 - "$file" "$max_bytes" >> "${CI_OUTPUT_LOG}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          max_bytes = int(sys.argv[2])
          data = path.read_bytes()[:max_bytes]
          text = data.decode("utf-8", errors="replace")
          print(text)
          if path.stat().st_size > max_bytes:
              print(f"... truncated after {max_bytes} bytes ...")
          PY
          }

          check_json_response() {
            local response_file="$1"
            local action="$2"

            RESPONSE_FILE="${response_file}" \
            RESPONSE_ACTION="${action}" \
              python3 <<'PY'
          import json
          import os
          from pathlib import Path

          response_text = Path(os.environ["RESPONSE_FILE"]).read_text(encoding="utf-8").strip()
          if not response_text:
              raise SystemExit(f"{os.environ['RESPONSE_ACTION']} returned an empty response.")

          response = json.loads(response_text)
          if isinstance(response, dict) and response.get("success") is False:
              raise SystemExit(
                  f"{os.environ['RESPONSE_ACTION']} failed: {response.get('error', 'unknown error')}"
              )
          PY
          }

          json_response_value() {
            local response_file="$1"
            local field_path="$2"

            RESPONSE_FILE="${response_file}" \
            RESPONSE_FIELD_PATH="${field_path}" \
              python3 <<'PY'
          import json
          import os
          from pathlib import Path

          response = json.loads(Path(os.environ["RESPONSE_FILE"]).read_text(encoding="utf-8"))
          value = response
          for part in os.environ["RESPONSE_FIELD_PATH"].split("."):
              if isinstance(value, dict) and part in value:
                  value = value[part]
              else:
                  raise SystemExit(1)
          if value is None:
              raise SystemExit(1)
          print(value)
          PY
          }

          classify_target() {
            local name="$1"
            local lower
            lower="$(printf '%s' "${name}" | tr '[:upper:]' '[:lower:]')"
            case "${lower}" in
              *.exe)
                printf 'windows\tWindows\tx86\n'
                ;;
              *.dmg)
                if [[ "${lower}" == *arm64* ]]; then
                  printf 'macos-arm64\tmacOS\tarm64\n'
                elif [[ "${lower}" == *x86_64* || "${lower}" == *x64* ]]; then
                  printf 'macos-x86_64\tmacOS\tx86_64\n'
                fi
                ;;
            esac
          }

          target_selected() {
            local target="$1"
            local requested normalized item
            requested="${UPLOAD_TARGETS:-all}"
            normalized="$(printf '%s' "${requested}" | tr '[:upper:]' '[:lower:]' | tr ';' ',')"
            if [ "${normalized}" = "all" ]; then
              return 0
            fi
            IFS=',' read -ra items <<< "${normalized}"
            for item in "${items[@]}"; do
              item="$(printf '%s' "${item}" | xargs)"
              if [ "${item}" = "${target}" ]; then
                return 0
              fi
            done
            return 1
          }

          write_chunked_upload_init_payload() {
            local package_file="$1"
            local platform="$2"
            local arch="$3"
            local init_payload_file="$4"

            RELEASE_VERSION="${release_version}" \
            PACKAGE_FILE="${package_file}" \
            PACKAGE_PLATFORM="${platform}" \
            PACKAGE_ARCH="${arch}" \
            PACKAGE_OVERWRITE="${PACKAGE_UPLOAD_OVERWRITE}" \
            PACKAGE_CHUNK_SIZE="${PACKAGE_UPLOAD_CHUNK_SIZE_BYTES}" \
            INIT_PAYLOAD_FILE="${init_payload_file}" \
              python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          package_file = Path(os.environ["PACKAGE_FILE"])
          chunk_size = int(os.environ["PACKAGE_CHUNK_SIZE"])
          hasher = hashlib.sha256()
          with package_file.open("rb") as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b""):
                  hasher.update(chunk)
          payload = {
              "version": os.environ["RELEASE_VERSION"].strip().lstrip("v"),
              "platform": os.environ["PACKAGE_PLATFORM"],
              "arch": os.environ["PACKAGE_ARCH"],
              "filename": package_file.name,
              "size": package_file.stat().st_size,
              "sha256": hasher.hexdigest(),
              "chunk_size": chunk_size,
              "overwrite": os.environ.get("PACKAGE_OVERWRITE", "true").strip().lower() == "true",
          }
          Path(os.environ["INIT_PAYLOAD_FILE"]).write_text(
              json.dumps(payload, ensure_ascii=True, separators=(",", ":")),
              encoding="utf-8",
          )
          print(f"{payload['size']} {payload['sha256']}")
          PY
          }

          upload_package_chunked() {
            local package_file="$1"
            local platform="$2"
            local arch="$3"
            local upload_index="$4"

            local package_name init_payload_file init_response_file init_headers_file init_meta_file
            local upload_id server_chunk_size part_dir complete_response_file complete_headers_file complete_meta_file
            package_name="$(basename "${package_file}")"
            init_payload_file="${work_dir}/upload-${upload_index}-init.json"
            init_response_file="${work_dir}/upload-${upload_index}-init-response.json"
            init_headers_file="${work_dir}/upload-${upload_index}-init.headers"
            init_meta_file="${work_dir}/upload-${upload_index}-init.meta"
            part_dir="${work_dir}/upload-${upload_index}-parts"
            complete_response_file="${work_dir}/upload-${upload_index}-complete-response.json"
            complete_headers_file="${work_dir}/upload-${upload_index}-complete.headers"
            complete_meta_file="${work_dir}/upload-${upload_index}-complete.meta"

            log_line "Initializing chunked upload for ${package_name}."
            write_chunked_upload_init_payload "${package_file}" "${platform}" "${arch}" "${init_payload_file}" >> "${CI_OUTPUT_LOG}" 2>&1
            set +e
            curl "${curl_args[@]}" \
              --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --dump-header "${init_headers_file}" \
              --output "${init_response_file}" \
              --write-out $'http_code=%{http_code}\nremote_ip=%{remote_ip}\ntime_total=%{time_total}\nsize_upload=%{size_upload}\nsize_download=%{size_download}\n' \
              --data @"${init_payload_file}" \
              "${chunked_uploads_endpoint}" > "${init_meta_file}" 2>> "${CI_OUTPUT_LOG}"
            init_curl_status=$?
            set -e
            log_line "chunked_init_curl_process_exit=${init_curl_status}"
            append_file_excerpt "chunked init timing" "${init_meta_file}" 4096
            append_file_excerpt "chunked init response headers" "${init_headers_file}" 8192
            append_file_excerpt "chunked init response body" "${init_response_file}" 8192
            init_http_code="$(awk -F= '$1 == "http_code" { print $2; exit }' "${init_meta_file}" || true)"
            if [ "${init_curl_status}" != "0" ] || [[ ! "${init_http_code:-000}" =~ ^2 ]]; then
              return 1
            fi
            check_json_response "${init_response_file}" "Chunked upload init ${package_name}" >> "${CI_OUTPUT_LOG}" 2>&1
            upload_id="$(json_response_value "${init_response_file}" "upload.id")"
            server_chunk_size="$(json_response_value "${init_response_file}" "upload.chunk_size")"

            rm -rf "${part_dir}"
            mkdir -p "${part_dir}"
            split -b "${server_chunk_size}" -d -a 6 "${package_file}" "${part_dir}/part-"
            mapfile -t part_files < <(find "${part_dir}" -maxdepth 1 -type f -name 'part-*' | sort)
            if [ "${#part_files[@]}" -eq 0 ]; then
              log_line "No split parts were produced for ${package_name}."
              return 1
            fi

            local part_index=0
            local part_file part_response_file part_headers_file part_meta_file part_curl_status part_http_code
            for part_file in "${part_files[@]}"; do
              part_response_file="${work_dir}/upload-${upload_index}-part-${part_index}.json"
              part_headers_file="${work_dir}/upload-${upload_index}-part-${part_index}.headers"
              part_meta_file="${work_dir}/upload-${upload_index}-part-${part_index}.meta"
              log_line "Uploading chunk ${part_index}/${#part_files[@]} for ${package_name} ($(stat -c '%s' "${part_file}") bytes)."
              set +e
              curl "${curl_args[@]}" \
                --fail-with-body \
                --request POST \
                --dump-header "${part_headers_file}" \
                --output "${part_response_file}" \
                --write-out $'http_code=%{http_code}\nremote_ip=%{remote_ip}\ntime_total=%{time_total}\nsize_upload=%{size_upload}\nsize_download=%{size_download}\n' \
                --form "file=@${part_file}" \
                "${chunked_uploads_endpoint}/${upload_id}/parts/${part_index}" > "${part_meta_file}" 2>> "${CI_OUTPUT_LOG}"
              part_curl_status=$?
              set -e
              log_line "chunked_part_${part_index}_curl_process_exit=${part_curl_status}"
              append_file_excerpt "chunked part ${part_index} timing" "${part_meta_file}" 4096
              append_file_excerpt "chunked part ${part_index} response headers" "${part_headers_file}" 4096
              append_file_excerpt "chunked part ${part_index} response body" "${part_response_file}" 4096
              part_http_code="$(awk -F= '$1 == "http_code" { print $2; exit }' "${part_meta_file}" || true)"
              if [ "${part_curl_status}" != "0" ] || [[ ! "${part_http_code:-000}" =~ ^2 ]]; then
                return 1
              fi
              check_json_response "${part_response_file}" "Chunked upload part ${part_index} ${package_name}" >> "${CI_OUTPUT_LOG}" 2>&1
              part_index=$((part_index + 1))
            done

            set +e
            curl "${curl_args[@]}" \
              --fail-with-body \
              --request POST \
              --dump-header "${complete_headers_file}" \
              --output "${complete_response_file}" \
              --write-out $'http_code=%{http_code}\nremote_ip=%{remote_ip}\ntime_total=%{time_total}\nsize_upload=%{size_upload}\nsize_download=%{size_download}\n' \
              "${chunked_uploads_endpoint}/${upload_id}/complete" > "${complete_meta_file}" 2>> "${CI_OUTPUT_LOG}"
            complete_curl_status=$?
            set -e
            log_line "chunked_complete_curl_process_exit=${complete_curl_status}"
            append_file_excerpt "chunked complete timing" "${complete_meta_file}" 4096
            append_file_excerpt "chunked complete response headers" "${complete_headers_file}" 8192
            append_file_excerpt "chunked complete response body" "${complete_response_file}" 8192
            complete_http_code="$(awk -F= '$1 == "http_code" { print $2; exit }' "${complete_meta_file}" || true)"
            if [ "${complete_curl_status}" != "0" ] || [[ ! "${complete_http_code:-000}" =~ ^2 ]]; then
              return 1
            fi
            check_json_response "${complete_response_file}" "Chunked upload complete ${package_name}" >> "${CI_OUTPUT_LOG}" 2>&1
          }

          log_section "runner context"
          {
            date -u
            uname -a
            curl --version
            printf 'sign_host=%s\n' "${sign_host}"
            printf 'release_tag=%s\n' "${release_tag}"
            printf 'release_version=%s\n' "${release_version}"
            printf 'upload_targets=%s\n' "${UPLOAD_TARGETS}"
            printf 'overwrite=%s\n' "${PACKAGE_UPLOAD_OVERWRITE}"
            printf 'update_client_version=%s\n' "${UPDATE_CLIENT_VERSION}"
            printf 'chunk_size_bytes=%s\n' "${PACKAGE_UPLOAD_CHUNK_SIZE_BYTES}"
            printf 'insecure_tls=%s\n' "${INSECURE_TLS}"
          } >> "${CI_OUTPUT_LOG}"

          {
            printf '### Sign service chunked API upload diagnostics\n'
            printf -- '- Detailed output is encrypted in the uploaded artifact.\n'
            printf -- '- Release ref: %s\n' "${release_tag}"
            printf -- '- Destination repository: %s\n' "${DESTINATION_REPOSITORY}"
            printf -- '- Host source: workflow input `sign_host`\n'
            printf -- '- Upload targets: %s\n' "${UPLOAD_TARGETS}"
            printf -- '- Chunk size: %s bytes\n' "${PACKAGE_UPLOAD_CHUNK_SIZE_BYTES}"
            printf -- '- Update latest version: %s\n' "${UPDATE_CLIENT_VERSION}"
          } > "${public_summary}"

          log_section "download destination release assets"
          export GH_TOKEN="${DESTINATION_TOKEN}"
          metadata_file="${work_dir}/release.json"
          gh release view "${release_tag}" \
            --repo "${DESTINATION_REPOSITORY}" \
            --json tagName,assets > "${metadata_file}"
          append_file_excerpt "release metadata" "${metadata_file}" 8192

          mapfile -t asset_names < <(
            python3 - "${metadata_file}" "${UPLOAD_TARGETS}" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          requested = sys.argv[2].strip().lower().replace(";", ",")
          selected = None if requested == "all" else {item.strip() for item in requested.split(",") if item.strip()}

          def classify(name: str) -> str | None:
              lower = name.lower()
              if lower.endswith(".exe"):
                  return "windows"
              if lower.endswith(".dmg") and "arm64" in lower:
                  return "macos-arm64"
              if lower.endswith(".dmg") and ("x86_64" in lower or "x64" in lower):
                  return "macos-x86_64"
              return None

          for asset in metadata.get("assets", []):
              name = str(asset.get("name") or "")
              target = classify(name)
              if target and (selected is None or target in selected):
                  print(name)
          PY
          )

          if [ "${#asset_names[@]}" -eq 0 ]; then
            echo "No release assets matched upload_targets=${UPLOAD_TARGETS}." >&2
            result="failure"
          else
            for asset_name in "${asset_names[@]}"; do
              log_line "Downloading ${asset_name}."
              gh release download "${release_tag}" \
                --repo "${DESTINATION_REPOSITORY}" \
                --pattern "${asset_name}" \
                --dir "${asset_dir}" \
                --clobber >> "${CI_OUTPUT_LOG}" 2>&1
            done
          fi

          uploaded_count=0
          if [ "${result}" = "success" ]; then
            log_section "upload packages through chunked API"
            shopt -s nullglob
            for package_file in "${asset_dir}"/*; do
              [ -f "${package_file}" ] || continue
              package_name="$(basename "${package_file}")"
              metadata="$(classify_target "${package_name}" || true)"
              if [ -z "${metadata}" ]; then
                log_line "Skipping unrecognized asset ${package_name}."
                continue
              fi
              IFS=$'\t' read -r target platform arch <<< "${metadata}"
              if ! target_selected "${target}"; then
                log_line "Skipping ${package_name}; target ${target} not requested."
                continue
              fi

              size_bytes="$(stat -c '%s' "${package_file}")"
              sha256="$(sha256sum "${package_file}" | awk '{print $1}')"

              log_line "Uploading ${package_name} as ${release_version}/${platform}/${arch}."
              log_line "size=${size_bytes}"
              log_line "sha256=${sha256}"

              if upload_package_chunked "${package_file}" "${platform}" "${arch}" "${uploaded_count}"; then
                curl_status=0
                http_code=200
              else
                curl_status=1
                http_code=000
              fi
              printf -- '- %s: HTTP %s, curl exit %s, size %s bytes\n' \
                "${package_name}" "${http_code:-n/a}" "${curl_status}" "${size_bytes}" >> "${public_summary}"

              if [ "${curl_status}" != "0" ]; then
                result="failure"
                continue
              fi
              uploaded_count=$((uploaded_count + 1))
            done
          fi

          if [ "${result}" = "success" ] && [ "${uploaded_count}" -eq 0 ]; then
            log_line "No package files were uploaded."
            printf -- '- No package files were uploaded.\n' >> "${public_summary}"
            result="failure"
          fi

          if [ "${result}" = "success" ] && [ "${UPDATE_CLIENT_VERSION}" = "true" ]; then
            log_section "update client latest version"
            update_payload_file="${work_dir}/client-versions-update.json"
            update_response_file="${work_dir}/client-versions-update-response.json"
            update_headers_file="${work_dir}/client-versions-update.headers"
            update_meta_file="${work_dir}/client-versions-update.meta"
            printf '{"latest_version":"%s"}' "${release_version}" > "${update_payload_file}"

            set +e
            curl "${curl_args[@]}" \
              --fail-with-body \
              --request PUT \
              --header "Content-Type: application/json" \
              --dump-header "${update_headers_file}" \
              --output "${update_response_file}" \
              --write-out $'http_code=%{http_code}\ntime_total=%{time_total}\nsize_upload=%{size_upload}\nsize_download=%{size_download}\n' \
              --data @"${update_payload_file}" \
              "${client_versions_endpoint}" > "${update_meta_file}" 2>> "${CI_OUTPUT_LOG}"
            update_curl_status=$?
            set -e

            log_line "client_version_update_curl_process_exit=${update_curl_status}"
            append_file_excerpt "client version update timing" "${update_meta_file}" 4096
            append_file_excerpt "client version update response headers" "${update_headers_file}" 8192
            append_file_excerpt "client version update response body" "${update_response_file}" 8192
            update_http_code="$(awk -F= '$1 == "http_code" { print $2; exit }' "${update_meta_file}" || true)"
            printf -- '- client version update: HTTP %s, curl exit %s\n' \
              "${update_http_code:-n/a}" "${update_curl_status}" >> "${public_summary}"
            if [ "${update_curl_status}" != "0" ] || [[ ! "${update_http_code:-000}" =~ ^2 ]]; then
              result="failure"
            elif ! check_json_response "${update_response_file}" "Client version update" >> "${CI_OUTPUT_LOG}" 2>&1; then
              result="failure"
            fi
          fi

          {
            printf '\n'
            printf 'Uploaded package count: %s\n' "${uploaded_count}"
            printf 'Diagnostic result: %s\n' "${result}"
          } >> "${public_summary}"

          cat "${public_summary}" >> "${GITHUB_STEP_SUMMARY}"
          echo "diagnostic_result=${result}" >> "${GITHUB_OUTPUT}"

      - name: Encrypt diagnostic output
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CI_OUTPUT_AGE_RECIPIENT:-}" ]; then
            echo "::error::Required secret or variable CI_OUTPUT_AGE_RECIPIENT is not configured."
            exit 1
          fi

          mkdir -p "$(dirname "${CI_OUTPUT_LOG}")"
          if [ ! -s "${CI_OUTPUT_LOG}" ]; then
            printf 'No captured diagnostic output.\n' > "${CI_OUTPUT_LOG}"
          fi

          age -r "${CI_OUTPUT_AGE_RECIPIENT}" -o "${CI_OUTPUT_ENCRYPTED}" "${CI_OUTPUT_LOG}"
          rm -f "${CI_OUTPUT_LOG}"

      - name: Upload encrypted diagnostic output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: encrypted-ci-output-api-upload-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_OUTPUT_ENCRYPTED }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail when chunked API upload diagnostics fail
        if: ${{ steps.diagnostics.outputs.diagnostic_result != 'success' }}
        shell: bash
        run: |
          echo "::error::Chunked API upload diagnostics failed. Download and decrypt the encrypted diagnostic artifact for details."
          exit 1
