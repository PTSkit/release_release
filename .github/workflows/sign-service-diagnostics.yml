name: sign-service-diagnostics

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing destination release tag to ask the signing service to pull.
        required: true
        type: string
        default: "v3.2.0"
      curl_max_time:
        description: Per-request curl max time in seconds.
        required: true
        type: string
        default: "1200"
      origin_ip:
        description: Optional origin server IP. When set, also tests SIGN_HOST via curl --resolve to bypass CDN/DNS.
        required: false
        type: string
      origin_insecure:
        description: Allow insecure TLS only for the optional origin_ip bypass route.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sign-service-diagnostics-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose signing service webhook path
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_OUTPUT_LOG: .ci-output/sign-service-diagnostics/ci-output.log
      CI_OUTPUT_ENCRYPTED: .ci-output/sign-service-diagnostics/ci-output.log.age
      SIGN_HOST: ${{ secrets.SIGN_HOST }}
      SIGN_MASTER_TOKEN: ${{ secrets.SIGN_MASTER_TOKEN }}
      DESTINATION_REPOSITORY: ${{ secrets.DESTINATION_REPOSITORY }}
      DESTINATION_TOKEN: ${{ secrets.DESTINATION_TOKEN }}
      CI_OUTPUT_AGE_RECIPIENT: ${{ secrets.CI_OUTPUT_AGE_RECIPIENT || vars.CI_OUTPUT_AGE_RECIPIENT }}
      RELEASE_REF: ${{ inputs.release_ref }}
      CURL_MAX_TIME: ${{ inputs.curl_max_time }}
      ORIGIN_IP: ${{ inputs.origin_ip }}
      ORIGIN_INSECURE: ${{ inputs.origin_insecure }}

    steps:
      - name: Checkout encrypted release repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate diagnostic configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${CI_OUTPUT_LOG}")"
          : > "${CI_OUTPUT_LOG}"

          for name in SIGN_HOST SIGN_MASTER_TOKEN DESTINATION_REPOSITORY DESTINATION_TOKEN CI_OUTPUT_AGE_RECIPIENT RELEASE_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret, variable, or input ${name} is not configured."
              exit 1
            fi
          done

          case "${CURL_MAX_TIME}" in
            ""|*[!0-9]*)
              echo "::error::curl_max_time must be a positive integer."
              exit 1
              ;;
          esac
          if [ "${CURL_MAX_TIME}" -lt 30 ] || [ "${CURL_MAX_TIME}" -gt 1800 ]; then
            echo "::error::curl_max_time must be between 30 and 1800."
            exit 1
          fi

      - name: Install age
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          age --version

      - name: Run signing service webhook diagnostics
        id: diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$(dirname "${CI_OUTPUT_LOG}")"
          public_summary="${RUNNER_TEMP}/sign-service-diagnostics-summary.md"
          work_dir="${RUNNER_TEMP}/sign-service-diagnostics"
          mkdir -p "${work_dir}"
          result="success"

          sign_host="${SIGN_HOST%/}"
          case "${sign_host}" in
            http://*|https://*) ;;
            *) sign_host="https://${sign_host}" ;;
          esac

          scheme="${sign_host%%://*}"
          host_and_path="${sign_host#*://}"
          host_port="${host_and_path%%/*}"
          host_name="${host_port%%:*}"
          if [ "${host_port}" != "${host_name}" ]; then
            host_port_number="${host_port##*:}"
          elif [ "${scheme}" = "http" ]; then
            host_port_number="80"
          else
            host_port_number="443"
          fi

          release_tag="${RELEASE_REF##refs/tags/}"
          release_version="${release_tag#v}"
          client_versions_endpoint="${sign_host}/admin/client-versions"
          webhook_endpoint="${sign_host}/admin/release-webhook"
          release_metadata_file="${work_dir}/release.json"
          webhook_payload_file="${work_dir}/release-webhook.json"
          user_agent="PTSkit Downloader/Bot"

          log_line() {
            printf '%s\n' "$*" >> "${CI_OUTPUT_LOG}"
          }

          log_section() {
            {
              printf '\n'
              printf '== %s ==\n' "$1"
            } >> "${CI_OUTPUT_LOG}"
          }

          append_file_excerpt() {
            local label="$1"
            local file="$2"
            local max_bytes="$3"

            log_line "-- ${label} (${file}) --"
            if [ ! -s "${file}" ]; then
              log_line "(empty)"
              return
            fi

            python3 - "$file" "$max_bytes" >> "${CI_OUTPUT_LOG}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          max_bytes = int(sys.argv[2])
          data = path.read_bytes()[:max_bytes]
          text = data.decode("utf-8", errors="replace")
          print(text)
          if path.stat().st_size > max_bytes:
              print(f"... truncated after {max_bytes} bytes ...")
          PY
          }

          json_response_value() {
            local response_file="$1"
            local field_path="$2"

            RESPONSE_FILE="${response_file}" \
            RESPONSE_FIELD_PATH="${field_path}" \
              python3 <<'PY'
          import json
          import os
          from pathlib import Path

          response = json.loads(Path(os.environ["RESPONSE_FILE"]).read_text(encoding="utf-8"))
          value = response
          for part in os.environ["RESPONSE_FIELD_PATH"].split("."):
              if isinstance(value, dict) and part in value:
                  value = value[part]
              else:
                  raise SystemExit(1)
          if value is None:
              raise SystemExit(1)
          print(value)
          PY
          }

          run_curl_probe() {
            local label="$1"
            local method="$2"
            local url="$3"
            shift 3

            local safe_label
            safe_label="$(printf '%s' "${label}" | tr -c 'A-Za-z0-9_.-' '_')"
            local headers="${work_dir}/${safe_label}.headers"
            local body="${work_dir}/${safe_label}.body"
            local meta="${work_dir}/${safe_label}.meta"

            log_section "curl probe: ${label}"
            log_line "method=${method}"
            log_line "url=${url}"

            set +e
            curl \
              --show-error \
              --silent \
              --location \
              --max-time "${CURL_MAX_TIME}" \
              --connect-timeout 30 \
              --request "${method}" \
              --header "User-Agent: ${user_agent}" \
              --header "X-Master-Key: ${SIGN_MASTER_TOKEN}" \
              --dump-header "${headers}" \
              --output "${body}" \
              --write-out $'http_code=%{http_code}\nremote_ip=%{remote_ip}\nlocal_ip=%{local_ip}\ntime_namelookup=%{time_namelookup}\ntime_connect=%{time_connect}\ntime_appconnect=%{time_appconnect}\ntime_pretransfer=%{time_pretransfer}\ntime_starttransfer=%{time_starttransfer}\ntime_total=%{time_total}\nsize_upload=%{size_upload}\nsize_download=%{size_download}\n' \
              "$@" \
              "${url}" > "${meta}" 2>> "${CI_OUTPUT_LOG}"
            local curl_status=$?
            set -e

            log_line "curl_process_exit=${curl_status}"
            append_file_excerpt "curl timing" "${meta}" 4096
            append_file_excerpt "response headers" "${headers}" 8192
            append_file_excerpt "response body" "${body}" 8192

            local http_code
            http_code="$(awk -F= '$1 == "http_code" { print $2; exit }' "${meta}" || true)"
            printf '%s\n' "${curl_status}" > "${work_dir}/${safe_label}.exit"
            printf '%s\n' "${http_code}" > "${work_dir}/${safe_label}.http"
          }

          poll_webhook_job() {
            local route_name="$1"
            local job_id="$2"
            shift 2
            local route_curl_args=("$@")
            local job_endpoint="${webhook_endpoint}/jobs/${job_id}"
            local deadline=$((SECONDS + CURL_MAX_TIME))
            local poll_interval=20
            local attempt=1

            while true; do
              local poll_label="${route_name}-release-webhook-job-${attempt}"
              run_curl_probe \
                "${poll_label}" \
                "GET" \
                "${job_endpoint}" \
                --fail-with-body \
                "${route_curl_args[@]}"

              local safe_poll_label poll_exit poll_http poll_body job_status job_error
              safe_poll_label="$(printf '%s' "${poll_label}" | tr -c 'A-Za-z0-9_.-' '_')"
              poll_exit="$(cat "${work_dir}/${safe_poll_label}.exit" 2>/dev/null || true)"
              poll_http="$(cat "${work_dir}/${safe_poll_label}.http" 2>/dev/null || true)"
              poll_body="${work_dir}/${safe_poll_label}.body"

              if [ "${poll_exit:-1}" != "0" ] || [[ ! "${poll_http:-000}" =~ ^2 ]]; then
                printf -- '- %s webhook job %s poll failed: HTTP %s, curl exit %s\n' \
                  "${route_name}" "${job_id}" "${poll_http:-n/a}" "${poll_exit:-n/a}" >> "${public_summary}"
                return 1
              fi

              job_status="$(json_response_value "${poll_body}" "job.status" 2>/dev/null || true)"
              log_line "job_id=${job_id}"
              log_line "job_status=${job_status:-unknown}"

              case "${job_status}" in
                success)
                  printf -- '- %s webhook job %s: success\n' "${route_name}" "${job_id}" >> "${public_summary}"
                  return 0
                  ;;
                failure)
                  job_error="$(json_response_value "${poll_body}" "job.error" 2>/dev/null || true)"
                  printf -- '- %s webhook job %s: failure (%s)\n' \
                    "${route_name}" "${job_id}" "${job_error:-unknown error}" >> "${public_summary}"
                  return 1
                  ;;
                queued|running)
                  if [ "${SECONDS}" -ge "${deadline}" ]; then
                    printf -- '- %s webhook job %s: timed out after %ss\n' \
                      "${route_name}" "${job_id}" "${CURL_MAX_TIME}" >> "${public_summary}"
                    return 1
                  fi
                  sleep "${poll_interval}"
                  ;;
                *)
                  printf -- '- %s webhook job %s: unknown status %s\n' \
                    "${route_name}" "${job_id}" "${job_status:-empty}" >> "${public_summary}"
                  return 1
                  ;;
              esac

              attempt=$((attempt + 1))
            done
          }

          run_route() {
            local route_name="$1"
            shift
            local route_curl_args=("$@")

            log_section "route: ${route_name}"
            if [ "${#route_curl_args[@]}" -gt 0 ]; then
              log_line "extra_curl_args=${route_curl_args[*]}"
            else
              log_line "extra_curl_args=(none)"
            fi

            run_curl_probe \
              "${route_name}-client-version-get" \
              "GET" \
              "${client_versions_endpoint}" \
              "${route_curl_args[@]}"

            run_curl_probe \
              "${route_name}-release-webhook" \
              "POST" \
              "${webhook_endpoint}" \
              --fail-with-body \
              "${route_curl_args[@]}" \
              --header "Content-Type: application/json" \
              --data @"${webhook_payload_file}"

            local safe_label webhook_exit webhook_http
            safe_label="$(printf '%s' "${route_name}-release-webhook" | tr -c 'A-Za-z0-9_.-' '_')"
            webhook_exit="$(cat "${work_dir}/${safe_label}.exit" 2>/dev/null || true)"
            webhook_http="$(cat "${work_dir}/${safe_label}.http" 2>/dev/null || true)"
            printf -- '- %s webhook: HTTP %s, curl exit %s\n' "${route_name}" "${webhook_http:-n/a}" "${webhook_exit:-n/a}" >> "${public_summary}"
            if [ "${webhook_exit:-1}" != "0" ] || [[ ! "${webhook_http:-000}" =~ ^2 ]]; then
              result="failure"
              return
            fi

            local webhook_body job_id
            webhook_body="${work_dir}/${safe_label}.body"
            job_id="$(json_response_value "${webhook_body}" "job.id" 2>/dev/null || true)"
            if [ -z "${job_id}" ]; then
              printf -- '- %s webhook: accepted response did not include job.id\n' "${route_name}" >> "${public_summary}"
              result="failure"
              return
            fi

            printf -- '- %s webhook job: %s\n' "${route_name}" "${job_id}" >> "${public_summary}"
            if ! poll_webhook_job "${route_name}" "${job_id}" "${route_curl_args[@]}"; then
              result="failure"
            fi
          }

          {
            printf '### Sign service webhook diagnostics\n'
            printf -- '- Detailed output is encrypted in the uploaded artifact.\n'
            printf -- '- Release ref: %s\n' "${release_tag}"
            printf -- '- Destination repository: %s\n' "${DESTINATION_REPOSITORY}"
            printf -- '- Origin insecure TLS: %s\n' "${ORIGIN_INSECURE}"
          } > "${public_summary}"

          log_section "runner context"
          {
            date -u
            uname -a
            curl --version
            printf 'sign_host=%s\n' "${sign_host}"
            printf 'host_name=%s\n' "${host_name}"
            printf 'host_port=%s\n' "${host_port_number}"
            printf 'release_tag=%s\n' "${release_tag}"
            printf 'release_version=%s\n' "${release_version}"
          } >> "${CI_OUTPUT_LOG}"

          log_section "fetch destination release metadata"
          GH_TOKEN="${DESTINATION_TOKEN}" gh release view "${release_tag}" \
            --repo "${DESTINATION_REPOSITORY}" \
            --json tagName,assets > "${release_metadata_file}"
          append_file_excerpt "release metadata" "${release_metadata_file}" 8192

          RELEASE_METADATA_FILE="${release_metadata_file}" \
          RELEASE_VERSION="${release_version}" \
          DESTINATION_REPOSITORY="${DESTINATION_REPOSITORY}" \
          WEBHOOK_PAYLOAD_FILE="${webhook_payload_file}" \
            python3 <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RELEASE_METADATA_FILE"]).read_text(encoding="utf-8"))
          version = os.environ["RELEASE_VERSION"].strip().lstrip("v")
          repository = os.environ["DESTINATION_REPOSITORY"].strip()
          payload_file = Path(os.environ["WEBHOOK_PAYLOAD_FILE"])

          def classify_asset(name: str):
              lower = name.lower()
              if lower.endswith(".exe"):
                  return "Windows", "x86"
              if lower.endswith(".dmg") and "arm64" in lower:
                  return "macOS", "arm64"
              if lower.endswith(".dmg") and ("x86_64" in lower or "x64" in lower):
                  return "macOS", "x86_64"
              return None

          assets = []
          for asset in metadata.get("assets", []):
              name = str(asset.get("name") or "")
              classified = classify_asset(name)
              if not classified:
                  continue
              platform, arch = classified
              assets.append(
                  {
                      "name": name,
                      "version": version,
                      "platform": platform,
                      "arch": arch,
                      "size": asset.get("size"),
                  }
              )

          if not assets:
              raise SystemExit("No release assets matched known package naming rules.")

          payload = {
              "repository": repository,
              "tag": metadata.get("tagName") or os.environ.get("RELEASE_REF", ""),
              "latest_version": version,
              "overwrite": True,
              "assets": assets,
          }
          payload_file.write_text(json.dumps(payload, ensure_ascii=True, separators=(",", ":")), encoding="utf-8")
          print(f"Prepared webhook payload with {len(assets)} asset(s).")
          for asset in assets:
              print(f"{asset['name']} -> {asset['version']}/{asset['platform']}/{asset['arch']}")
          PY
          append_file_excerpt "webhook payload" "${webhook_payload_file}" 8192

          log_section "dns"
          {
            getent ahosts "${host_name}" || true
            if command -v nslookup >/dev/null 2>&1; then
              nslookup "${host_name}" || true
            fi
          } >> "${CI_OUTPUT_LOG}" 2>&1

          run_route "default"

          origin_ip="$(printf '%s' "${ORIGIN_IP:-}" | tr -d '[:space:]')"
          if [ -n "${origin_ip}" ]; then
            origin_curl_args=(--resolve "${host_name}:${host_port_number}:${origin_ip}")
            if [ "${ORIGIN_INSECURE}" = "true" ]; then
              origin_curl_args+=(--insecure)
            fi
            run_route "origin" "${origin_curl_args[@]}"
          else
            printf -- '- Origin bypass: skipped; provide origin_ip to compare direct source behavior.\n' >> "${public_summary}"
          fi

          {
            printf '\n'
            printf 'Diagnostic result: %s\n' "${result}"
          } >> "${public_summary}"

          cat "${public_summary}" >> "${GITHUB_STEP_SUMMARY}"
          echo "diagnostic_result=${result}" >> "${GITHUB_OUTPUT}"

      - name: Encrypt diagnostic output
        if: always()
        shell: bash
        env:
          CI_OUTPUT_AGE_RECIPIENT: ${{ secrets.CI_OUTPUT_AGE_RECIPIENT || vars.CI_OUTPUT_AGE_RECIPIENT }}
        run: |
          set -euo pipefail

          if [ -z "${CI_OUTPUT_AGE_RECIPIENT:-}" ]; then
            echo "::error::Required secret or variable CI_OUTPUT_AGE_RECIPIENT is not configured."
            exit 1
          fi

          mkdir -p "$(dirname "${CI_OUTPUT_LOG}")"
          if [ ! -s "${CI_OUTPUT_LOG}" ]; then
            printf 'No captured diagnostic output.\n' > "${CI_OUTPUT_LOG}"
          fi

          age -r "${CI_OUTPUT_AGE_RECIPIENT}" -o "${CI_OUTPUT_ENCRYPTED}" "${CI_OUTPUT_LOG}"
          rm -f "${CI_OUTPUT_LOG}"

      - name: Upload encrypted diagnostic output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: encrypted-ci-output-sign-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_OUTPUT_ENCRYPTED }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail when webhook diagnostics fail
        if: ${{ steps.diagnostics.outputs.diagnostic_result != 'success' }}
        shell: bash
        run: |
          echo "::error::Signing service webhook diagnostics failed. Download and decrypt the encrypted diagnostic artifact for details."
          exit 1
