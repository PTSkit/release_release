name: release-notification-test

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Version shown in the notification.
        required: true
        type: string
        default: v3.2.0
      production_message:
        description: Send the exact production release notification text.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send-test-notification:
    name: Send test release notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send OneBot group notification
        shell: bash
        env:
          BOT_IP: ${{ secrets.BOT_IP }}
          BOT_PORT: ${{ secrets.BOT_PORT }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_GROUP_NUMBER: ${{ secrets.BOT_GROUP_NUMBER }}
          RELEASE_REF: ${{ inputs.release_ref }}
          PRODUCTION_MESSAGE: ${{ inputs.production_message }}
        run: |
          set -euo pipefail

          missing=()
          for name in BOT_IP BOT_PORT BOT_TOKEN BOT_GROUP_NUMBER; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}."
            exit 1
          fi

          if [ "${PRODUCTION_MESSAGE}" = "true" ]; then
            message="$(printf '[CQ:at,qq=all]\n新版本 %s 已发布' "${RELEASE_REF}")"
          else
            message="$(printf '[CQ:at,qq=all]\n测试通知：新版本 %s 已发布' "${RELEASE_REF}")"
          fi

          payload_file="${RUNNER_TEMP}/onebot-release-notification.json"
          BOT_MESSAGE="${message}" python3 - "${payload_file}" <<'PY'
          import json
          import os
          import sys

          payload = {
              "message_type": "group",
              "group_id": os.environ["BOT_GROUP_NUMBER"],
              "message": os.environ["BOT_MESSAGE"],
          }

          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(payload, output, ensure_ascii=False)
          PY

          curl --fail-with-body --silent --show-error \
            --request POST "http://${BOT_IP}:${BOT_PORT}/send_msg" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${BOT_TOKEN}" \
            --data @"${payload_file}"
